# CloudBridge — Customer A (ACME Technologies) Ansible Inventory
# Network: 192.168.56.0/24 (VirtualBox host-only vboxnet0)
# Managed from: Kali host at 192.168.56.10
#
# SSH key: generated locally, never committed to this repository
# Key location: ~/.ssh/cloudbridge_lab_rsa (not in repo)

[customer_a_all:children]
customer_a_workstations
customer_a_appservers
customer_a_databases

[customer_a_workstations]
customer-a-workstation ansible_host=192.168.56.20

[customer_a_appservers]
customer-a-appserver ansible_host=192.168.56.30

[customer_a_databases]
customer-a-database ansible_host=192.168.56.31

[customer_a_all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/cloudbridge_lab_rsa
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
customer_name=acme-technologies
customer_id=customer-a
environment=lab
