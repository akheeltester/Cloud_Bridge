# CloudBridge — Customer B (BluePeak Solutions) Ansible Inventory
# Network: 192.168.57.0/24 (VirtualBox host-only vboxnet1)
# Managed from: Kali host at 192.168.57.10
#
# Note: Customer B lab uses Docker containers managed via Docker Compose.
# VMs are optional for this customer (Docker is the primary simulation method).

[customer_b_all:children]
customer_b_webservers
customer_b_databases

[customer_b_webservers]
customer-b-webserver ansible_host=192.168.57.30

[customer_b_databases]
customer-b-database ansible_host=192.168.57.31

[customer_b_all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/cloudbridge_lab_rsa
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
customer_name=bluepeak-solutions
customer_id=customer-b
environment=lab
