# CloudBridge — Customer B (BluePeak Solutions) Docker Compose Simulation
#
# Simulates the "AWS source environment" for migration planning.
# This is NOT a real AWS environment — it is a local Docker simulation.
#
# Simulated services:
#   - Nginx web server (simulates EC2 web application)
#   - FastAPI application (simulates Python backend on EC2)
#   - PostgreSQL 14 (simulates EC2 self-managed database)
#   - MinIO (simulates S3 bucket for application uploads)
#
# Usage:
#   cd customers/customer-b/docker
#   docker compose up -d
#   docker compose down
#
# Credentials: see .env.example — copy to .env and fill in values
# .env is gitignored — never commit it

services:
  # ── Web Application (simulates EC2 Nginx + Python) ──────────────────────
  webserver:
    image: nginx:1.27-alpine
    container_name: customer-b-webserver
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
    networks:
      customer-b:
        ipv4_address: 10.203.20.10
    labels:
      com.cloudbridge.customer: "customer-b"
      com.cloudbridge.service: "webserver"
      com.cloudbridge.simulation: "true"

  # ── PostgreSQL Database (simulates EC2 self-managed PG) ─────────────────
  database:
    image: postgres:14-alpine
    container_name: customer-b-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bluepeak_app}
      POSTGRES_USER: ${POSTGRES_USER:-bluepeak_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?err_db_password_required}
    volumes:
      - customer-b-pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    # NOT exposing port 5432 to host — app connects internally
    expose:
      - "5432"
    networks:
      customer-b:
        ipv4_address: 10.203.20.11
    labels:
      com.cloudbridge.customer: "customer-b"
      com.cloudbridge.service: "database"
      com.cloudbridge.simulation: "true"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bluepeak_user} -d ${POSTGRES_DB:-bluepeak_app}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Application API (simulates Python backend on EC2) ──────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: customer-b-app
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_HOST: database
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-bluepeak_app}
      DATABASE_USER: ${POSTGRES_USER:-bluepeak_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?err_db_password_required}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-bluepeak-uploads}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?err_minio_password_required}
    networks:
      customer-b:
        ipv4_address: 10.203.20.13
    labels:
      com.cloudbridge.customer: "customer-b"
      com.cloudbridge.service: "app"
      com.cloudbridge.simulation: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/live').read()"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── MinIO (simulates S3 bucket) ─────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: customer-b-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?err_minio_password_required}
    volumes:
      - customer-b-miniodata:/data
    ports:
      - "127.0.0.1:19000:9000"   # S3 API
      - "127.0.0.1:19001:9001"   # Console UI
    networks:
      customer-b:
        ipv4_address: 10.203.20.12
    labels:
      com.cloudbridge.customer: "customer-b"
      com.cloudbridge.service: "object-storage"
      com.cloudbridge.simulation: "true"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  customer-b:
    driver: bridge
    ipam:
      config:
        - subnet: 10.203.20.0/24
    labels:
      com.cloudbridge.customer: "customer-b"
      com.cloudbridge.simulation: "true"

volumes:
  customer-b-pgdata:
    driver: local
    labels:
      com.cloudbridge.customer: "customer-b"
  customer-b-miniodata:
    driver: local
    labels:
      com.cloudbridge.customer: "customer-b"
