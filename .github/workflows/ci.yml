name: CI — Terraform Validation and Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # ---------------------------------------------------------------------------
  # Secret scanning — runs first; downstream jobs depend on this passing
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Push event ──────────────────────────────────────────────────────────
      # github.event.before is the SHA before the push.
      # If it is all zeros this is the very first push to the branch — fall back
      # to a full-repo scan (no base/head so TruffleHog scans all commits).
      - name: Secret Scan — push (incremental)
        if: >
          github.event_name == 'push' &&
          github.event.before != '0000000000000000000000000000000000000000'
        uses: trufflesecurity/trufflehog@v3.88.29
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
          extra_args: --only-verified

      - name: Secret Scan — push (first commit / full repo)
        if: >
          github.event_name == 'push' &&
          github.event.before == '0000000000000000000000000000000000000000'
        uses: trufflesecurity/trufflehog@v3.88.29
        with:
          path: ./
          extra_args: --only-verified

      # ── Pull request event ───────────────────────────────────────────────────
      - name: Secret Scan — pull request
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@v3.88.29
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

      # ── Manual dispatch — full repo scan ────────────────────────────────────
      - name: Secret Scan — manual dispatch (full repo)
        if: github.event_name == 'workflow_dispatch'
        uses: trufflesecurity/trufflehog@v3.88.29
        with:
          path: ./
          extra_args: --only-verified

  # ---------------------------------------------------------------------------
  # Terraform format and validation
  # Runs only when .tf files exist in the target directory.
  # Empty directories are skipped with an informational message — not failed.
  # ---------------------------------------------------------------------------
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    needs: secret-scan

    strategy:
      fail-fast: false
      matrix:
        working-directory:
          - terraform/aws/modules/network
          - terraform/aws/environments/lab

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for Terraform files
        id: tf-check
        run: |
          if find "${{ matrix.working-directory }}" -name "*.tf" -maxdepth 2 | grep -q .; then
            echo "has_tf=true" >> "$GITHUB_OUTPUT"
            echo "Terraform files found in ${{ matrix.working-directory }}"
          else
            echo "has_tf=false" >> "$GITHUB_OUTPUT"
            echo "No .tf files in ${{ matrix.working-directory }} — skipping (Phase 3 will add modules)"
          fi

      - name: Setup Terraform
        if: steps.tf-check.outputs.has_tf == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"

      - name: Terraform Format Check
        if: steps.tf-check.outputs.has_tf == 'true'
        run: terraform fmt -check -recursive
        working-directory: ${{ matrix.working-directory }}

      - name: Terraform Init (no backend)
        if: steps.tf-check.outputs.has_tf == 'true'
        run: terraform init -backend=false
        working-directory: ${{ matrix.working-directory }}

      - name: Terraform Validate
        if: steps.tf-check.outputs.has_tf == 'true'
        run: terraform validate
        working-directory: ${{ matrix.working-directory }}

  # ---------------------------------------------------------------------------
  # Checkov IaC security scan
  # Runs only when at least one .tf file exists anywhere under terraform/.
  # ---------------------------------------------------------------------------
  checkov:
    name: Checkov IaC Scan
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for Terraform files
        id: tf-check
        run: |
          if find terraform/ -name "*.tf" | grep -q .; then
            echo "has_tf=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tf=false" >> "$GITHUB_OUTPUT"
            echo "No .tf files found under terraform/ — Checkov skipped (Phase 3 will add modules)"
          fi

      - name: Run Checkov
        if: steps.tf-check.outputs.has_tf == 'true'
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          output_format: cli
          soft_fail: true  # Phase 1: advisory only — enforced from Phase 3

  # ---------------------------------------------------------------------------
  # Markdown lint
  # ---------------------------------------------------------------------------
  docs-lint:
    name: Documentation Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            **/*.md
            !node_modules/**
            !dashboard/node_modules/**
          config: .markdownlint.json
