name: CI — Terraform Validation and Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write  # for SARIF upload if added later

jobs:
  # ---------------------------------------------------------------------------
  # Secret scanning — runs first, blocks everything else if it fails
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for accurate secret scanning

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@v3.88.29
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # ---------------------------------------------------------------------------
  # Terraform format and validation
  # ---------------------------------------------------------------------------
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    needs: secret-scan

    strategy:
      matrix:
        working-directory:
          - terraform/aws/modules/network
          - terraform/aws/environments/lab

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: ${{ matrix.working-directory }}
        continue-on-error: true  # format failures are warnings until modules exist

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: ${{ matrix.working-directory }}
        continue-on-error: true  # modules may not exist yet in early phases

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ matrix.working-directory }}
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Checkov IaC security scan
  # ---------------------------------------------------------------------------
  checkov:
    name: Checkov IaC Scan
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          output_format: cli
          soft_fail: true  # Phase 1: advisory only. Will be enforced from Phase 3.
          # skip_check: CKV_AWS_XXX  # add suppressions here with justification comments

  # ---------------------------------------------------------------------------
  # Markdown and documentation lint
  # ---------------------------------------------------------------------------
  docs-lint:
    name: Documentation Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            **/*.md
            !node_modules
            !dashboard/node_modules
        continue-on-error: true  # advisory in Phase 1
