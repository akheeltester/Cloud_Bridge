name: Security Scan — Scheduled

on:
  schedule:
    # Run every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:  # allow manual trigger

permissions:
  contents: read
  security-events: write

jobs:
  full-secret-scan:
    name: Full Repository Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Full Scan
        uses: trufflesecurity/trufflehog@v3.88.29
        with:
          path: ./
          extra_args: --only-verified

  checkov-full:
    name: Checkov Full Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkov — Terraform
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          output_format: sarif
          output_file_path: checkov-terraform.sarif
          soft_fail: true

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-terraform.sarif
        continue-on-error: true  # SARIF upload requires GitHub Advanced Security
