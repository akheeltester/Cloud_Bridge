<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CloudBridge</title>
    <script>
      const base = "/Cloud_Bridge";
      const path = window.location.pathname.startsWith(base)
        ? window.location.pathname.slice(base.length)
        : "/";
      const route = `${path || "/"}${window.location.search}${window.location.hash}`;
      window.location.replace(`${base}/?p=${encodeURIComponent(route)}`);
    </script>
  </head>
  <body>
    <p>Opening CloudBridge…</p>
  </body>
</html>
